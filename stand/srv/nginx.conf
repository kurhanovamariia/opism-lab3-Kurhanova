# srv: the remote HTTP server of the transport lab.
#   port 80   HTTP/1.1 with keep-alive: the client closes first, TIME_WAIT stays on the client
user www-data;
worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
    access_log /dev/stdout;
    error_log  /dev/stderr;
    default_type application/octet-stream;
    root /srv/www;

    server {
        listen 80 default_server;
        keepalive_timeout 75s;
        keepalive_requests 1000;
        location = / { default_type text/plain; return 200 "server: srv:80\nclient: $remote_addr:$remote_port\n"; }
    }
}
